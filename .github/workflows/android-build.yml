name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Pin the TDLib release tag produced by `build-tdlib.yml`.
  # Set this once after running that workflow; bump on TDLib version changes.
  TDLIB_RELEASE_TAG: tdlib-master-PLACEHOLDER

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch TDLib AAR from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          if [ "$TDLIB_RELEASE_TAG" = "tdlib-master-PLACEHOLDER" ]; then
            echo "::warning::TDLIB_RELEASE_TAG is not pinned. Run the 'Build TDLib AAR' workflow once and update env.TDLIB_RELEASE_TAG."
            # Create a stub so Gradle's flatDir reference doesn't fail; the build will fail at link/runtime.
            echo "stub" > app/libs/tdlib.aar
            exit 0
          fi
          gh release download "$TDLIB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern tdlib.aar \
            --dir app/libs \
            --clobber
          ls -lh app/libs/

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -PAPI_ID="${{ secrets.API_ID }}" \
            -PAPI_HASH="${{ secrets.API_HASH }}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch TDLib AAR from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          gh release download "$TDLIB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern tdlib.aar \
            --dir app/libs \
            --clobber

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing. Cannot sign release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -lh "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PAPI_ID="${{ secrets.API_ID }}" \
            -PAPI_HASH="${{ secrets.API_HASH }}"

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
