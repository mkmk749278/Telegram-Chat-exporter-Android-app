name: Build TDLib AAR

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "TDLib git ref (branch, tag, or sha)"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TDLIB_REF: ${{ github.event.inputs.tdlib_ref }}
    steps:
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git perl pkg-config zlib1g-dev gperf cmake clang \
            libc++-dev libc++abi-dev ccache unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK r25c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ env.TDLIB_REF }}
          path: td
          fetch-depth: 1

      - name: Resolve TDLib short SHA
        id: sha
        working-directory: td
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: tdlib-ccache-${{ runner.os }}-${{ env.TDLIB_REF }}-${{ steps.sha.outputs.short }}
          restore-keys: |
            tdlib-ccache-${{ runner.os }}-${{ env.TDLIB_REF }}-
            tdlib-ccache-${{ runner.os }}-

      - name: Show TDLib Android scripts
        working-directory: td/example/android
        run: ls -la

      - name: Build OpenSSL for Android
        working-directory: td/example/android
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          PATH: /usr/lib/ccache:${{ env.PATH }}
        run: ./build-openssl.sh

      - name: Build TDLib JNI + AAR
        working-directory: td/example/android
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          PATH: /usr/lib/ccache:${{ env.PATH }}
        run: ./build-tdlib.sh

      - name: Locate AAR
        id: aar
        run: |
          set -eux
          # The build script puts the AAR somewhere under td/example/android/tdlib/.
          # Search to be resilient to TDLib reorganising the layout.
          path=$(find td/example/android -name 'td-release.aar' -o -name 'td-debug.aar' | head -1)
          if [ -z "$path" ]; then
            echo "::error::No AAR found under td/example/android/"
            find td/example/android -name '*.aar' || true
            exit 1
          fi
          mkdir -p out
          cp "$path" out/tdlib.aar
          ls -lh out/
          echo "src=$path" >> "$GITHUB_OUTPUT"

      - name: Publish release with tdlib.aar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tdlib-${{ env.TDLIB_REF }}-${{ steps.sha.outputs.short }}
          name: TDLib (${{ env.TDLIB_REF }} @ ${{ steps.sha.outputs.short }})
          body: |
            Auto-built TDLib Android AAR.
            Source: https://github.com/tdlib/td/commit/${{ steps.sha.outputs.short }}
            Pin this tag in `.github/workflows/android-build.yml` (`TDLIB_RELEASE_TAG`).
          files: out/tdlib.aar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## TDLib AAR built"
            echo ""
            echo "- Source AAR: \`${{ steps.aar.outputs.src }}\`"
            echo "- Tag: \`tdlib-${{ env.TDLIB_REF }}-${{ steps.sha.outputs.short }}\`"
            echo "- Update \`TDLIB_RELEASE_TAG\` in \`.github/workflows/android-build.yml\` to consume it."
          } >> "$GITHUB_STEP_SUMMARY"
